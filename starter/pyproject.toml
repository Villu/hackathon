[project]
name = "resilient-gateway-starter"
version = "0.1.0"
description = "Hackathon starter: resilient agentic gateway for infrastructure incident triage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "google-genai>=1.20",
  "mcp>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "anyio>=4"]
azure = [
  "azure-identity>=1.17",
  "azure-monitor-query>=1.4",
  "azure-mgmt-appcontainers>=3.0",
  "azure-mgmt-alertsmanagement>=1.0",
]
kafka = ["aiokafka>=0.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gateway*", "mcp_server*", "simulator*", "evals*"]

[tool.setuptools.package-data]
evals = ["golden/*.jsonl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
